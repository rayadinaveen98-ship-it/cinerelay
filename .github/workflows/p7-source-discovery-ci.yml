name: CineRelay P7 Source Discovery CI

on:
  pull_request:
    paths:
      - 'supabase/functions/source-discovery-worker/**'
      - 'supabase/functions/cinerelay-scheduler-dispatch/**'
      - 'supabase/functions/cinerelay-source-discovery-api/**'
      - 'supabase/functions/cinerelay-source-relationship-api/**'
      - 'apps/web/src/pages/SourceDiscoveryWorkflow.tsx'
      - 'apps/web/src/pages/SourceEntityRelationshipWorkflow.tsx'
      - 'apps/web/src/pages/OperationsPage.tsx'
      - 'apps/web/src/lib/source-discovery-api.ts'
      - 'apps/web/src/lib/source-relationship-api.ts'
      - 'supabase/migrations/**p7_2_source_discovery**'
      - 'supabase/migrations/**p7_2_automatic_source_discovery**'
      - 'supabase/migrations/**p7_4_operator_identity_attachment**'
      - 'supabase/migrations/**p7_5_source_entity_relationship**'
      - 'supabase/tests/database/source_discovery_automation_p7_2.test.sql'
      - 'supabase/tests/database/source_identity_attachment_p7_4.test.sql'
      - 'supabase/tests/database/source_entity_relationship_suggestions_p7_5.test.sql'
      - '.github/workflows/p7-source-discovery-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/source-discovery-worker/**'
      - 'supabase/functions/cinerelay-scheduler-dispatch/**'
      - 'supabase/functions/cinerelay-source-discovery-api/**'
      - 'supabase/functions/cinerelay-source-relationship-api/**'
      - 'apps/web/src/pages/SourceDiscoveryWorkflow.tsx'
      - 'apps/web/src/pages/SourceEntityRelationshipWorkflow.tsx'
      - 'apps/web/src/pages/OperationsPage.tsx'
      - 'apps/web/src/lib/source-discovery-api.ts'
      - 'apps/web/src/lib/source-relationship-api.ts'
      - 'supabase/migrations/**p7_2_source_discovery**'
      - 'supabase/migrations/**p7_2_automatic_source_discovery**'
      - 'supabase/migrations/**p7_4_operator_identity_attachment**'
      - 'supabase/migrations/**p7_5_source_entity_relationship**'
      - 'supabase/tests/database/source_discovery_automation_p7_2.test.sql'
      - 'supabase/tests/database/source_identity_attachment_p7_4.test.sql'
      - 'supabase/tests/database/source_entity_relationship_suggestions_p7_5.test.sql'
      - '.github/workflows/p7-source-discovery-ci.yml'

concurrency:
  group: cinerelay-p7-source-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-discovery-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check source-discovery-worker
        run: deno check --config supabase/functions/source-discovery-worker/deno.json supabase/functions/source-discovery-worker/index.ts
      - name: Type-check scheduler dispatcher
        run: deno check --config supabase/functions/cinerelay-scheduler-dispatch/deno.json supabase/functions/cinerelay-scheduler-dispatch/index.ts
      - name: Type-check source-discovery operator API
        run: deno check --config supabase/functions/cinerelay-source-discovery-api/deno.json supabase/functions/cinerelay-source-discovery-api/index.ts
      - name: Type-check source-relationship operator API
        run: deno check --config supabase/functions/cinerelay-source-relationship-api/deno.json supabase/functions/cinerelay-source-relationship-api/index.ts
      - name: Build deployment-native P7 Edge bundle
        shell: bash
        run: |
          set -euo pipefail
          for fn in source-discovery-worker cinerelay-scheduler-dispatch cinerelay-source-discovery-api cinerelay-source-relationship-api; do
            mkdir -p "p7-edge-deploy/$fn"
            npx --yes esbuild@0.25.9 "supabase/functions/$fn/index.ts" \
              --bundle \
              --format=esm \
              --platform=neutral \
              --main-fields=module,main \
              --target=es2022 \
              --minify \
              --external:@supabase/supabase-js \
              --outfile="p7-edge-deploy/$fn/index.js"
            cp "supabase/functions/$fn/deno.json" "p7-edge-deploy/$fn/deno.json"
          done
      - name: Upload P7 deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: cinerelay-p7-source-discovery-deploy-bundle
          path: p7-edge-deploy
          if-no-files-found: error
          retention-days: 7

  officiality-review-console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://dnqaejljfzwhsainpdxb.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hR65p2JkQ2x5fFLx_kkcNQ_1SxNN3QP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm --prefix apps/web install --no-audit --no-fund --ignore-scripts
      - name: Build operator console
        run: npm --prefix apps/web run build
      - name: Verify officiality, identity lifecycle, and relationship surfaces are in browser artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -R -F 'officiality proposal' apps/web/dist/assets --include='*.js'
          grep -R -F 'Ownership verification required' apps/web/dist/assets --include='*.js'
          grep -R -F 'Trust boundary' apps/web/dist/assets --include='*.js'
          grep -R -F 'Attach inactive identity' apps/web/dist/assets --include='*.js'
          grep -R -F 'Activate connector identity' apps/web/dist/assets --include='*.js'
          grep -R -F 'X provider polling is intentionally paused' apps/web/dist/assets --include='*.js'
          grep -R -F 'Title/source relationship suggestions' apps/web/dist/assets --include='*.js'
          grep -R -F 'Approve time-bounded relationship' apps/web/dist/assets --include='*.js'
          grep -R -F 'Source-scope resolutions are explicitly excluded' apps/web/dist/assets --include='*.js'
          if grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|CINERELAY_INTERNAL_ADMIN_SECRET' apps/web/dist; then
            echo 'Forbidden privileged credential marker found in P7 browser bundle' >&2
            exit 1
          fi
