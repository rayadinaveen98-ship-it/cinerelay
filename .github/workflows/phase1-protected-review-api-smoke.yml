name: CineRelay Protected Review API Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-review-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify private review API rejects unauthenticated reads
        env:
          REVIEW_API_URL: https://dnqaejljfzwhsainpdxb.supabase.co/functions/v1/cinerelay-review-api
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          # Intentionally NO Supabase publishable key, access token, cookies
          # or privileged secrets. Verify BOTH operator read-only endpoints.
          for action in pendingCatalogueReviewQueue activeCatalogueQualityAudit catalogueCorrectionImpactPreview; do
            payload="$(printf '{"action":"%s","limit":1}' "$action")"
            code="$(curl --silent --show-error --max-time 20 --retry 1 \
              --request POST -H 'content-type: application/json' \
              --data "$payload" \
              --output "$body" --write-out '%{http_code}' "$REVIEW_API_URL")"
            if [[ "$code" != "401" ]] || ! grep -Fq '"authentication_required"' "$body"; then
              echo "::error::$action did not reject no-token request (HTTP $code)"
              exit 1
            fi
            if grep -Eq '"(items|sourceEvidence|eventSamples|rawTitle|producerEvidenceLeads)"[[:space:]]*:' "$body"; then
              echo "::error::$action leaked protected fields without login"
              exit 1
            fi
            echo "PASS: $action no-token -> 401"

            code="$(curl --silent --show-error --max-time 20 --retry 1 \
              --request POST -H 'content-type: application/json' \
              -H 'authorization: Bearer not-a-valid-session' \
              --data "$payload" \
              --output "$body" --write-out '%{http_code}' "$REVIEW_API_URL")"
            if [[ "$code" != "401" ]] || ! grep -Fq '"invalid_session"' "$body"; then
              echo "::error::$action did not reject invalid session (HTTP $code)"
              exit 1
            fi
            if grep -Eq '"(items|sourceEvidence|eventSamples|rawTitle|producerEvidenceLeads)"[[:space:]]*:' "$body"; then
              echo "::error::$action leaked protected fields with invalid session"
              exit 1
            fi
            echo "PASS: $action invalid bearer -> 401"
          done

          code="$(curl --silent --show-error --max-time 20 --retry 1 \
            --request GET --output "$body" --write-out '%{http_code}' "$REVIEW_API_URL")"
          if [[ "$code" != "405" ]]; then
            echo "::error::Unexpected GET method status HTTP $code"
            exit 1
          fi
          echo "PASS: private endpoint is POST-only"

          code="$(curl --silent --show-error --max-time 20 --retry 1 \
            --request OPTIONS --output "$body" --write-out '%{http_code}' "$REVIEW_API_URL")"
          if [[ "$code" != "204" ]]; then
            echo "::error::CORS preflight returned unexpected HTTP $code"
            exit 1
          fi
          echo "PASS: browser preflight supported"
