name: CineRelay CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: cinerelay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intelligence-and-connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run ci

  web-console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://dnqaejljfzwhsainpdxb.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hR65p2JkQ2x5fFLx_kkcNQ_1SxNN3QP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm --prefix apps/web install --no-audit --no-fund --ignore-scripts
      - name: Build web console
        run: npm --prefix apps/web run build
      - name: Verify static-host contract and browser configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/dist/_redirects
          test -f apps/web/dist/_headers
          grep -F '/* /index.html 200' apps/web/dist/_redirects
          grep -F 'Content-Security-Policy:' apps/web/dist/_headers
          grep -R -F "$VITE_SUPABASE_URL" apps/web/dist/assets --include='*.js'
          grep -R -F "$VITE_SUPABASE_PUBLISHABLE_KEY" apps/web/dist/assets --include='*.js'
          if grep -R -F 'VITE_SUPABASE_URL:void 0' apps/web/dist/assets --include='*.js'; then
            echo 'VITE Supabase URL was not bound into the browser artifact' >&2
            exit 1
          fi
          if grep -R -F 'VITE_SUPABASE_PUBLISHABLE_KEY:void 0' apps/web/dist/assets --include='*.js'; then
            echo 'VITE Supabase publishable key was not bound into the browser artifact' >&2
            exit 1
          fi
          if grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|CINERELAY_INTERNAL_ADMIN_SECRET|CINERELAY_WEBSUB_MASTER_SECRET|YOUTUBE_API_KEY|THREADS_PROFILE_DISCOVERY_ACCESS_TOKEN|INSTAGRAM_BUSINESS_DISCOVERY_ACCESS_TOKEN|INSTAGRAM_MANAGED_IG_USER_ID|CINERELAY_FCM_SERVICE_ACCOUNT' apps/web/dist; then
            echo 'Forbidden privileged credential marker found in browser bundle' >&2
            exit 1
          fi
      - name: Upload deployable static console artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinerelay-web-console-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check youtube-websub
        run: deno check --config supabase/functions/youtube-websub/deno.json supabase/functions/youtube-websub/index.ts
      - name: Type-check youtube-subscription-admin
        run: deno check --config supabase/functions/youtube-subscription-admin/deno.json supabase/functions/youtube-subscription-admin/index.ts
      - name: Type-check youtube-enrichment-worker
        run: deno check --config supabase/functions/youtube-enrichment-worker/deno.json supabase/functions/youtube-enrichment-worker/index.ts
      - name: Type-check process-raw-item-worker
        run: deno check --config supabase/functions/process-raw-item-worker/deno.json supabase/functions/process-raw-item-worker/index.ts
      - name: Type-check youtube-fallback-worker
        run: deno check --config supabase/functions/youtube-fallback-worker/deno.json supabase/functions/youtube-fallback-worker/index.ts
      - name: Type-check youtube-source-admin
        run: deno check --config supabase/functions/youtube-source-admin/deno.json supabase/functions/youtube-source-admin/index.ts
      - name: Type-check youtube-maintenance-worker
        run: deno check --config supabase/functions/youtube-maintenance-worker/deno.json supabase/functions/youtube-maintenance-worker/index.ts
      - name: Type-check feed-poll-worker
        run: deno check --config supabase/functions/feed-poll-worker/deno.json supabase/functions/feed-poll-worker/index.ts
      - name: Type-check page-poll-worker
        run: deno check --config supabase/functions/page-poll-worker/deno.json supabase/functions/page-poll-worker/index.ts
      - name: Type-check threads-profile-poll-worker
        run: deno check --config supabase/functions/threads-profile-poll-worker/deno.json supabase/functions/threads-profile-poll-worker/index.ts
      - name: Type-check instagram-business-poll-worker
        run: deno check --config supabase/functions/instagram-business-poll-worker/deno.json supabase/functions/instagram-business-poll-worker/index.ts
      - name: Type-check cinerelay-scheduler-dispatch
        run: deno check --config supabase/functions/cinerelay-scheduler-dispatch/deno.json supabase/functions/cinerelay-scheduler-dispatch/index.ts
      - name: Type-check cinerelay-console-api
        run: deno check --config supabase/functions/cinerelay-console-api/deno.json supabase/functions/cinerelay-console-api/index.ts
      - name: Type-check cinerelay-review-api
        run: deno check --config supabase/functions/cinerelay-review-api/deno.json supabase/functions/cinerelay-review-api/index.ts
      - name: Type-check cinerelay-source-discovery-api
        run: deno check --config supabase/functions/cinerelay-source-discovery-api/deno.json supabase/functions/cinerelay-source-discovery-api/index.ts
      - name: Type-check cinerelay-public-page-onboarding-api
        run: deno check --config supabase/functions/cinerelay-public-page-onboarding-api/deno.json supabase/functions/cinerelay-public-page-onboarding-api/index.ts
      - name: Type-check cinerelay-device-registration-api
        run: deno check --config supabase/functions/cinerelay-device-registration-api/deno.json supabase/functions/cinerelay-device-registration-api/index.ts
      - name: Type-check push-delivery-worker
        run: deno check --config supabase/functions/push-delivery-worker/deno.json supabase/functions/push-delivery-worker/index.ts
      - name: Type-check digest-compose-worker
        run: deno check --config supabase/functions/digest-compose-worker/deno.json supabase/functions/digest-compose-worker/index.ts
      - name: Build deployment-native Edge bundles
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            youtube-websub
            youtube-source-admin
            youtube-subscription-admin
            youtube-enrichment-worker
            process-raw-item-worker
            youtube-fallback-worker
            youtube-maintenance-worker
            feed-poll-worker
            page-poll-worker
            threads-profile-poll-worker
            instagram-business-poll-worker
            cinerelay-scheduler-dispatch
            cinerelay-console-api
            cinerelay-review-api
            cinerelay-source-discovery-api
            cinerelay-public-page-onboarding-api
            cinerelay-device-registration-api
            push-delivery-worker
            digest-compose-worker
          )
          for fn in "${functions[@]}"; do
            mkdir -p "edge-deploy/${fn}"
            npx --yes esbuild@0.25.9 "supabase/functions/${fn}/index.ts" \
              --bundle \
              --format=esm \
              --platform=neutral \
              --main-fields=module,main \
              --target=es2022 \
              --minify \
              --external:@supabase/supabase-js \
              --external:node-html-parser \
              --outfile="edge-deploy/${fn}/index.js"
            cp "supabase/functions/${fn}/deno.json" "edge-deploy/${fn}/deno.json"
          done
      - name: Upload verified Edge source bundle
        uses: actions/upload-artifact@v4
        with:
          name: cinerelay-edge-bundle
          path: |
            supabase/functions
            packages/domain/dist
            packages/youtube-connector/dist
            packages/feed-connector/dist
            packages/web-page-connector/dist
            packages/threads-connector/dist
            packages/instagram-connector/dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload deployment-native Edge bundle
        uses: actions/upload-artifact@v4
        with:
          name: cinerelay-edge-deploy-bundle
          path: edge-deploy
          if-no-files-found: error
          retention-days: 7

  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start database and apply migrations
        run: supabase db start
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Lint database functions
        run: supabase db lint --level error
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
