name: CineRelay CI

on:
  push:
    branches:
      - main
      - "phase-1/**"
      - "phase-2/**"
  pull_request:

concurrency:
  group: cinerelay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intelligence-and-connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run ci

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check youtube-websub
        run: deno check --config supabase/functions/youtube-websub/deno.json supabase/functions/youtube-websub/index.ts
      - name: Type-check youtube-subscription-admin
        run: deno check --config supabase/functions/youtube-subscription-admin/deno.json supabase/functions/youtube-subscription-admin/index.ts
      - name: Type-check youtube-enrichment-worker
        run: deno check --config supabase/functions/youtube-enrichment-worker/deno.json supabase/functions/youtube-enrichment-worker/index.ts
      - name: Type-check process-raw-item-worker
        run: deno check --config supabase/functions/process-raw-item-worker/deno.json supabase/functions/process-raw-item-worker/index.ts
      - name: Type-check youtube-fallback-worker
        run: deno check --config supabase/functions/youtube-fallback-worker/deno.json supabase/functions/youtube-fallback-worker/index.ts
      - name: Type-check youtube-source-admin
        run: deno check --config supabase/functions/youtube-source-admin/deno.json supabase/functions/youtube-source-admin/index.ts
      - name: Type-check youtube-maintenance-worker
        run: deno check --config supabase/functions/youtube-maintenance-worker/deno.json supabase/functions/youtube-maintenance-worker/index.ts

  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild database from migrations
        run: supabase db reset --local
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Lint database functions
        run: supabase db lint --level error
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
