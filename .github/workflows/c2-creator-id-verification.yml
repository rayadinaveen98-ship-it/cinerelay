name: CineRelay C2 Identity Verification (Disabled - Private TTL Required)

# Historical C2 wrote official YouTube identities into Git. C19 retires this
# workflow. Re-enable only with approved private 28-day storage and a live
# quota/retention review. Never commit API responses to a branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled-pending-private-ingest:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo 'C2 historical workflow disabled; no API calls or Git writes'
