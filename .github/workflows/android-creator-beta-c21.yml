name: CineRelay C21 Creator Intelligence Beta APK

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'tests/youtube-connector/run-creator-c21-android-beta.mjs'
      - '.github/workflows/android-creator-beta-c21.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cinerelay-c21-creator-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minified-signed-release:
    name: Signed Android Creator beta, unit tests and update certificate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CINERELAY_VERSION_CODE: '221002'
      CINERELAY_VERSION_NAME: '0.2.10-creator-beta.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare Android SDK 36 and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Require permanent update signer
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CINERELAY_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CINERELAY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CINERELAY_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CINERELAY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret:-}" ]]; then
              echo "::error::Missing permanent signer. Refusing to produce a release APK."
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/cinerelay-s3-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "CINERELAY_SIGNING_STORE_FILE=$KEYSTORE"
            echo "CINERELAY_SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CINERELAY_SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "CINERELAY_SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Require Firebase Android client configuration
        shell: bash
        env:
          FIREBASE_JSON_B64: ${{ secrets.CINERELAY_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_JSON_B64:-}" ]]; then
            echo "::error::Firebase client config missing. Release QA must cover notifications."
            exit 1
          fi
          TARGET=apps/android/app/google-services.json
          printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > "$TARGET"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('apps/android/app/google-services.json').read_text())
          assert data.get('project_info', {}).get('project_number')
          clients = [c for c in data.get('client', []) if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.cinerelay.app']
          assert len(clients) >= 1
          assert clients[0].get('client_info', {}).get('mobilesdk_app_id')
          assert any(k.get('current_key') for k in clients[0].get('api_key', []))
          assert not any(k in data for k in ('private_key', 'private_key_id', 'client_email'))
          print('Firebase Android release contract satisfied.')
          PY
      - name: Reject privileged secret strings in app source
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|CINERELAY_INTERNAL_ADMIN_SECRET|CINERELAY_FCM_SERVICE_ACCOUNT|BEGIN PRIVATE KEY' apps/android/app/src; then
            echo "::error::Privileged secret marker in Android source"
            exit 1
          fi
      - name: Unit tests and true minified release APK
        run: gradle -p apps/android --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease
      - name: Validate manifest, R8 output, version and permanent signing
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          MAP=apps/android/app/build/outputs/mapping/release/mapping.txt
          test -s "$APK"
          test -s "$MAP"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$SIGNER"
          "$AAPT" dump badging "$APK" > /tmp/cinerelay-release-badging.txt
          grep -q "package: name='com.cinerelay.app' versionCode='221002' versionName='0.2.10-creator-beta.1'" /tmp/cinerelay-release-badging.txt
          if grep -q 'application-debuggable' /tmp/cinerelay-release-badging.txt; then
            echo "::error::Release APK is debuggable"
            exit 1
          fi
          "$SIGNER" verify --print-certs "$APK" > /tmp/cinerelay-release-certificate.txt
          EXPECTED="$(tr -d '[:space:]' < apps/android/signing/cinerelay-update-cert.sha256 | tr '[:lower:]' '[:upper:]')"
          ACTUAL="$(awk -F': ' '/certificate SHA-256 digest/{print toupper($NF); exit}' /tmp/cinerelay-release-certificate.txt | tr -d ':[:space:]')"
          test -n "$ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Release signer differs from the permanent update certificate"
            exit 1
          fi
          if grep -a -E 'SUPABASE_SERVICE_ROLE_KEY|CINERELAY_INTERNAL_ADMIN_SECRET|CINERELAY_FCM_SERVICE_ACCOUNT|BEGIN PRIVATE KEY' "$APK"; then
            echo "::error::Privileged secret marker present in release APK"
            exit 1
          fi
          test "$(stat -c %s "$APK")" -gt 1000000
          mkdir -p creator-beta-out
          cp "$APK" creator-beta-out/CineRelay-C21-Creator-Beta-v0.2.10.apk
          sha256sum creator-beta-out/*.apk > creator-beta-out/sha256.txt
          printf 'versionCode=221002\nversionName=0.2.10-creator-beta.1\npackage=com.cinerelay.app\nbuildType=release\nminify=true\nshrinkResources=true\nFirebase=true\nsignerSHA256=%s\n' "$ACTUAL" > creator-beta-out/release-verification.txt
          cp /tmp/cinerelay-release-badging.txt creator-beta-out/manifest-badging.txt
          echo 'True Android release APK passed version, minification and permanent signer checks.'
      - name: Upload QA-only signed stable candidate
        uses: actions/upload-artifact@v4
        with:
          name: cinerelay-c21-creator-intelligence-beta-apk
          path: creator-beta-out/
          if-no-files-found: error
          retention-days: 7

