name: CineRelay Consumer Experience CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cinerelay-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check consumer API
        run: deno check --config supabase/functions/cinerelay-consumer-api/deno.json supabase/functions/cinerelay-consumer-api/index.ts
      - name: Type-check universal search API
        run: deno check --config supabase/functions/cinerelay-universal-search-api/deno.json supabase/functions/cinerelay-universal-search-api/index.ts
      - name: Build deployment-native consumer API bundles
        shell: bash
        run: |
          set -euo pipefail
          for fn in cinerelay-consumer-api cinerelay-universal-search-api; do
            mkdir -p "consumer-api-deploy/$fn"
            npx --yes esbuild@0.25.9 "supabase/functions/$fn/index.ts" \
              --bundle \
              --format=esm \
              --platform=neutral \
              --main-fields=module,main \
              --target=es2022 \
              --external:@supabase/supabase-js \
              --outfile="consumer-api-deploy/$fn/index.js"
            cp "supabase/functions/$fn/deno.json" "consumer-api-deploy/$fn/deno.json"
          done
      - name: Upload verified consumer API bundle
        uses: actions/upload-artifact@v4
        with:
          name: cinerelay-consumer-api-deploy-bundle
          path: consumer-api-deploy
          if-no-files-found: error
          retention-days: 7
