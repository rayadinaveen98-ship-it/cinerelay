name: CineRelay Android Canary CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cinerelay-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install domain build dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build shared domain types
        run: npm run build:domain
      - name: Type-check guest-aware mobile API
        run: deno check --config supabase/functions/cinerelay-mobile-api/deno.json supabase/functions/cinerelay-mobile-api/index.ts
      - name: Type-check evidence detail API
        run: deno check --config supabase/functions/cinerelay-evidence-api/deno.json supabase/functions/cinerelay-evidence-api/index.ts
      - name: Type-check fast newsroom API
        run: deno check --config supabase/functions/cinerelay-newsroom-api/deno.json supabase/functions/cinerelay-newsroom-api/index.ts
      - name: Build deployment-native mobile API bundles
        shell: bash
        run: |
          set -euo pipefail
          for fn in cinerelay-mobile-api cinerelay-evidence-api cinerelay-newsroom-api; do
            mkdir -p "mobile-api-deploy/$fn"
            npx --yes esbuild@0.25.9 "supabase/functions/$fn/index.ts" \
              --bundle \
              --format=esm \
              --platform=neutral \
              --main-fields=module,main \
              --target=es2022 \
              --minify \
              --external:@supabase/supabase-js \
              --outfile="mobile-api-deploy/$fn/index.js"
            cp "supabase/functions/$fn/deno.json" "mobile-api-deploy/$fn/deno.json"
          done
      - name: Upload deployment-native mobile API bundle
        uses: actions/upload-artifact@v4
        with:
          name: cinerelay-mobile-apis-v0.2-deploy-bundle
          path: mobile-api-deploy
          if-no-files-found: error
          retention-days: 7

  android-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CINERELAY_SUPABASE_URL: https://dnqaejljfzwhsainpdxb.supabase.co
      CINERELAY_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hR65p2JkQ2x5fFLx_kkcNQ_1SxNN3QP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install stable Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Configure Firebase Android client when available
        id: firebase-config
        shell: bash
        env:
          FIREBASE_JSON_B64: ${{ secrets.CINERELAY_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          TARGET='apps/android/app/google-services.json'
          rm -f "$TARGET"
          if [[ -z "${FIREBASE_JSON_B64:-}" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'CINERELAY_FIREBASE_CONFIGURED=false' >> "$GITHUB_ENV"
            echo 'Firebase Android config secret is absent; building the safe fallback canary.'
            exit 0
          fi

          printf '%s' "$FIREBASE_JSON_B64" | base64 --decode > "$TARGET"
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('apps/android/app/google-services.json')
          data = json.loads(path.read_text())
          project = data.get('project_info') or {}
          if not project.get('project_number'):
              raise SystemExit('Firebase config is missing project_info.project_number')
          clients = []
          for client in data.get('client') or []:
              info = client.get('client_info') or {}
              android = info.get('android_client_info') or {}
              if android.get('package_name') == 'com.cinerelay.app':
                  clients.append(client)
          if not clients:
              raise SystemExit('Firebase config does not contain Android package com.cinerelay.app')
          client_info = clients[0].get('client_info') or {}
          if not client_info.get('mobilesdk_app_id'):
              raise SystemExit('Firebase config is missing mobilesdk_app_id')
          if not any((item or {}).get('current_key') for item in (clients[0].get('api_key') or [])):
              raise SystemExit('Firebase config is missing the Android API key')
          print('Firebase Android config validated for com.cinerelay.app')
          PY
          if grep -E '"private_key"|"private_key_id"|"client_email"' "$TARGET"; then
            echo 'Server credential material must never be supplied as google-services.json' >&2
            exit 1
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
          echo 'CINERELAY_FIREBASE_CONFIGURED=true' >> "$GITHUB_ENV"
      - name: Verify Android source contains no privileged secret material
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|CINERELAY_INTERNAL_ADMIN_SECRET|CINERELAY_FCM_SERVICE_ACCOUNT|BEGIN PRIVATE KEY' \
            apps/android/app/src apps/android/*.kts apps/android/app/*.kts; then
            echo 'Privileged server credential marker found in Android source' >&2
            exit 1
          fi
      - name: Build CineRelay V0.2 Canary APK
        run: gradle -p apps/android --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Firebase build contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CINERELAY_FIREBASE_CONFIGURED:-false}" == 'true' ]]; then
            test -s apps/android/app/google-services.json
            if ! grep -R -E 'FIREBASE_CONFIGURED[^[:alnum:]]+true' apps/android/app/build/generated >/dev/null; then
              echo 'Firebase config was supplied but BuildConfig.FIREBASE_CONFIGURED was not generated as true' >&2
              grep -R -n 'FIREBASE_CONFIGURED' apps/android/app/build/generated || true
              exit 1
            fi
            echo 'Firebase-enabled CineRelay canary contract verified.'
          else
            test ! -e apps/android/app/google-services.json
            if ! grep -R -E 'FIREBASE_CONFIGURED[^[:alnum:]]+false' apps/android/app/build/generated >/dev/null; then
              echo 'Fallback canary did not generate BuildConfig.FIREBASE_CONFIGURED=false' >&2
              grep -R -n 'FIREBASE_CONFIGURED' apps/android/app/build/generated || true
              exit 1
            fi
            echo 'Fallback CineRelay canary contract verified; FCM is intentionally disabled.'
          fi
      - name: Verify APK and package contract
        shell: bash
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          test -s "$APK"
          unzip -p "$APK" classes.dex > /tmp/cinerelay-classes.dex || true
          if grep -a -E 'SUPABASE_SERVICE_ROLE_KEY|CINERELAY_INTERNAL_ADMIN_SECRET|CINERELAY_FCM_SERVICE_ACCOUNT|BEGIN PRIVATE KEY' "$APK" /tmp/cinerelay-classes.dex; then
            echo 'Privileged credential marker found in APK' >&2
            exit 1
          fi
          sha256sum "$APK" | tee apps/android/app/build/outputs/apk/debug/CineRelay-v0.2.0-canary.sha256
          printf '%s\n' "${CINERELAY_FIREBASE_CONFIGURED:-false}" > apps/android/app/build/outputs/apk/debug/CineRelay-v0.2.0-canary.firebase-configured.txt
      - name: Upload installable CineRelay APK
        uses: actions/upload-artifact@v4
        with:
          name: cinerelay-android-v0.2.0-canary-apk
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/CineRelay-v0.2.0-canary.sha256
            apps/android/app/build/outputs/apk/debug/CineRelay-v0.2.0-canary.firebase-configured.txt
          if-no-files-found: error
          retention-days: 7
