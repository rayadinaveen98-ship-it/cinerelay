name: CineRelay immutable APK baseline safety tests

on:
  pull_request:
    paths:
      - 'apps/android/qa/**'
      - '.github/workflows/android-stable-validation-s4.yml'
      - '.github/workflows/apk-baseline-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/qa/**'
      - '.github/workflows/android-stable-validation-s4.yml'
      - '.github/workflows/apk-baseline-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-tests:
    name: Verify released APK identity and fallback safety (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate upgrade script is one parseable Bash program
        run: bash -n apps/android/qa/run_s4_upgrade.sh
      - name: Run immutable APK baseline regression tests with Python standard library
        run: python3 -m unittest discover -s apps/android/qa/tests -v
